<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mind the Fit</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <span class="brand"><span class="mark" aria-hidden="true">M<em>t</em>F</span><span class="wordmark">MIND<em>the</em>FIT</span></span>
      <a id="open-app" href="#" class="link-muted">Open app</a>
    </header>

    <section id="connect-view" class="view hidden">
      <p class="lead">Sign in once to check fits against your measurements.</p>
      <button id="signin-btn" class="btn-primary">Sign in to connect</button>
      <details class="manual-code">
        <summary>Have a connection code instead?</summary>
        <input id="token-input" type="text" placeholder="Paste your connection code" />
        <button id="connect-btn" class="btn-secondary">Connect with code</button>
        <p id="connect-error" class="error hidden"></p>
      </details>
    </section>

    <section id="main-view" class="view hidden">
      <p id="status" class="status hidden"><span class="spinner"></span><span id="status-text"></span></p>

      <div id="not-listing" class="not-listing hidden">
        <p class="lead">This page doesn't look like a listing, so it wasn't checked.</p>
        <button id="check-anyway-btn" class="btn-secondary">Check it anyway</button>
      </div>

      <div id="result" class="result hidden"></div>

      <p id="main-error" class="error hidden"></p>
      <button id="retry-btn" class="btn-secondary retry hidden">Try again</button>
      <p id="usage-note" class="muted hidden"></p>

      <button id="disconnect-btn" class="link-muted disconnect">Sign out</button>
    </section>

    <section id="loading-view" class="view">
      <p class="muted">Loading…</p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
